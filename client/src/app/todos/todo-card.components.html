@if (todo()) {
  <mat-card class="todo-card">
    <mat-card-header>

      <mat-card-title class="todo-card-owner">{{ todo().owner }}</mat-card-title>
      <mat-card-subtitle class="todo-card-category">{{ todo().category }}</mat-card-subtitle>
    </mat-card-header>
    @if (!simple()) {
      <mat-card-content>
        <mat-list>
          <mat-list-item>
            <mat-icon matListItemIcon>dataset</mat-icon>
            <p matListItemTitle>Owner</p>
            <!--
            We had to put both the `role` and `age` entries on a single line. Otherwise
            we got an annoying leading space in front of the values.
            -->
            <p matListItemLine class="todo-card-owner">{{ todo().owner }}</p>
          </mat-list-item>
          <mat-divider [inset]=true></mat-divider>
          <mat-list-item>
            <mat-icon matListItemIcon>schedule</mat-icon>
            <p matListItemTitle>Status</p>
            <p matListItemLine class="todo-card-status">{{ todo().status }}</p>
          </mat-list-item>
          <mat-divider [inset]=true></mat-divider>
          <mat-list-item>
            <a href="mailto:{{todo().body}}"  matListItemIcon><mat-icon>cloud</mat-icon></a>
            <p matListItemTitle>Body</p>
            <a matListItemLine class="todo-card-body" href="mailto:{{todo().body}}">{{todo().body}}</a>
            <a href="mailto:{{todo().body}}" matListItemMeta mat-icon-button><mat-icon>open_in_new</mat-icon></a>
          </mat-list-item>
        </mat-list>
      </mat-card-content>
    }
    @if (simple()) {
      <mat-card-actions>
        <button mat-button data-test="viewProfileButton" [routerLink]="['/todos', todo()._id]">View Profile</button>
      </mat-card-actions>
    }
  </mat-card>
}
